
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

input_boolean:
  solar_charge_enabled:
    name: テスラ太陽光充電有効化
    icon: mdi:car-battery

input_number:
  solar_charge_buffer_w:
    name: テスラ太陽光充電余剰
    min: 0
    max: 1000
    step: 50
    mode: slider
    unit_of_measurement: W
    icon: mdi:battery-10

  solar_charge_min_amps:
    name: テスラ太陽光充電 最小電流
    min: 5
    max: 16
    step: 1
    mode: slider
    unit_of_measurement: A
    icon: mdi:current-ac

  estimated_house_w:
    name: 家庭消費 推定値
    min: 0
    max: 3000
    step: 50
    mode: slider
    unit_of_measurement: W
    icon: mdi:home-lightning-bolt

mqtt:
  sensor:

    # ===== 買電量 =====
    # NOTE: PCS の normalDirectionElectricEnergy は実際の grid 買電ではなく
    # PCS 内部の AC-DC 累計（≒ 待機消費）を返すらしく、累計が異常に低い。
    # 真の買電量はスマートメーター (0x0288) からしか取れない。要対応。
    - name: "買電量"
      unique_id: power_buy_total
      default_entity_id: sensor.power_buy_total
      state_topic: "echonetlite2mqtt/elapi/v2/devices/fe00006c42624b4a61504b314d0955414f/properties"
      value_template: "{{ value_json.normalDirectionElectricEnergy | float }}"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

    # ===== 売電量 =====
    # ソースは PV (0x0279) の cumulativeElectricEnergySold が正。
    # PCS の reverseDirectionElectricEnergy は PCS DC-AC 出力総量で、
    # 真の売電量より約77%過大なため使わない。
    - name: "売電量"
      unique_id: power_sell_total
      default_entity_id: sensor.power_sell_total
      state_topic: "echonetlite2mqtt/elapi/v2/devices/fe00006c4257357052646f5a4e09416f38/properties"
      value_template: "{{ value_json.cumulativeElectricEnergySold | float }}"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

    # ===== 発電量 =====
    - name: "発電量"
      unique_id: solar_total
      default_entity_id: sensor.solar_total
      state_topic: "echonetlite2mqtt/elapi/v2/devices/fe00006c4257357052646f5a4e09416f38/properties"
      value_template: "{{ value_json.cumulativeElectricEnergyOfGeneration | float }}"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

    # ===== 瞬時電力 =====
    # NOTE: PCS の instantaneousElectricPower は grid 連系点ではなく
    # PCS 内部 (≒ -solar_instant) を測っているため、家庭消費は反映されない。
    # 余剰算出には使わず、観察用として残すのみ。
    - name: "瞬時電力"
      unique_id: power_instant
      default_entity_id: sensor.power_instant
      state_topic: "echonetlite2mqtt/elapi/v2/devices/fe00006c42624b4a61504b314d0955414f/properties"
      value_template: "{{ value_json.instantaneousElectricPower | float }}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement

    # ===== 瞬時発電電力 =====
    - name: "瞬時発電電力"
      unique_id: solar_instant
      default_entity_id: sensor.solar_instant
      state_topic: "echonetlite2mqtt/elapi/v2/devices/fe00006c4257357052646f5a4e09416f38/properties"
      value_template: "{{ value_json.instantaneousElectricPowerGeneration | float }}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement

utility_meter:

  power_buy_daily:
    source: sensor.power_buy_total
    cycle: daily
    name: "買電量（日次）"

  power_buy_monthly:
    source: sensor.power_buy_total
    cycle: monthly
    name: "買電量（月次）"

  power_sell_daily:
    source: sensor.power_sell_total
    cycle: daily
    name: "売電量（日次）"

  power_sell_monthly:
    source: sensor.power_sell_total
    cycle: monthly
    name: "売電量（月次）"

  solar_daily:
    source: sensor.solar_total
    cycle: daily
    name: "発電量（日次）"

  solar_monthly:
    source: sensor.solar_total
    cycle: monthly
    name: "発電量（月次）"


template:
  - sensor:
      - name: "売電金額_日次"
        unique_id: sell_price_daily
        default_entity_id: sensor.sell_price_daily
        unit_of_measurement: "円"
        state: >
          {{ states('sensor.power_sell_daily') | float(0) * 16 }}

      - name: "売電金額_月次"
        unique_id: sell_price_monthly
        default_entity_id: sensor.sell_price_monthly
        unit_of_measurement: "円"
        state: >
          {{ states('sensor.power_sell_monthly') | float(0) * 16 }}

