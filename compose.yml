services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      TZ: Asia/Tokyo

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - tunnel-net
    depends_on:
      - tesla-pubkey

  tesla-pubkey:
    image: nginx:alpine
    container_name: tesla-pubkey
    restart: unless-stopped
    volumes:
      - ./tesla-pubkey/html:/usr/share/nginx/html:ro
      - ./tesla-pubkey/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - tunnel-net

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log
    restart: unless-stopped

  echonetlite2mqtt:
    container_name: echonetlite2mqtt
    image: banban525/echonetlite2mqtt
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      MQTT_BROKER: mqtt://localhost:1883

networks:
  tunnel-net:
    driver: bridge
